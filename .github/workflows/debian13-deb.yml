name: Debian 13 DEB Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debian13-deb:
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim
      options: --user root

    steps:
      # Package list notes (keep comments OUTSIDE the backslash-continued
      # list — a `#` line inside it silently terminates the command):
      #   unzip -> Xray ships as a .zip, gzip -> mihomo needs gunzip,
      #   gh    -> the host runner's /usr/bin/gh is NOT visible inside a
      #            container job, and the upload step below needs it.
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libayatana-appindicator3-dev libgtk-3-dev \
            unzip gzip gh \
            && rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must be installed BEFORE setup-node: `cache: 'pnpm'` shells out
      # to the pnpm binary (it was failing with "Unable to locate executable
      # file: pnpm" while the setup-pnpm step still sat below it).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      # v5 runs on the Node 24 runtime — v4 still boots on the deprecated
      # Node 20 runtime and emits the "Node 20 is being deprecated" notice.
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust (x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch bundled cores & rule sets
        shell: bash
        run: >
          bash scripts/ci-fetch-with-retry.sh
          scripts/fetch-bundled-core-linux-amd64.sh
          scripts/fetch-bundled-xray-linux-amd64.sh
          scripts/fetch-bundled-mihomo-linux-amd64.sh
          scripts/fetch-bundled-rule-sets.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (DEB only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Satelite ${{ github.ref_name }}"
          releaseBody: "Automatic DEB release for Debian 13"
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu --config src-tauri/tauri.debian13.conf.json

      - name: Upload DEB to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/deb/*.deb --clobber